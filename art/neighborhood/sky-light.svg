ke="#5d6a5f" stroke-width="2.5" fill="none" stroke-linecap="round" transform="translate(1230 300) scale(0.8)"><path d="M-8 10 q4 -5 8 0 q4 -5 8 0"/><path d="M8 4 q4 -5 8 0 q4 -5 8 0"/><path d="M36 10 q4 -5 8 0 q4 -5 8 0"/></g><g class="flock" stroke="#5d6a5f" stroke-width="2.9" fill="none" stroke-linecap="round" transform="translate(1330 640) scale(0.7)"><path d="M-8 5 q4 -5 8 0 q4 -5 8 0"/><path d="M8 9 q4 -5 8 0 q4 -5 8 0"/></g><g class="balloon" transform="translate(1260 400)"><path d="M0 -40 C 26 -40 30 -14 22 2 L8 22 L-8 22 L-22 2 C -30 -14 -26 -40 0 -40 Z" fill="#c9785a"/><path d="M0 -40 C 10 -40 12 -14 8 2 L3 22 L-3 22 L-8 2 C -12 -14 -10 -40 0 -40 Z" fill="#f2cf72"/><path d="M-7 22 L-5 30 M7 22 L5 30" stroke="#7a6552" stroke-width="1.2"/><rect x="-6" y="30" width="12" height="9" rx="2" fill="#8a6e5d"/></g>
